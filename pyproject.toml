[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orca"
version = "1.0.0"
description = "ORCA - Open RF Integrated Circuit Automation: an open-source EDA tool for AI-assisted RFIC design that builds neural network surrogate models of RFIC components (gdsfactory GDS generation, Palace EM simulation, PyTorch training, ONNX export for COBRA)"
readme = "README.md"
keywords = [
    "RFIC",
    "RF integrated circuit",
    "surrogate model",
    "machine learning",
    "neural network",
    "electromagnetic simulation",
    "EM simulation",
    "Palace",
    "gdsfactory",
    "GDS",
    "ONNX",
    "PyTorch",
    "S-parameters",
    "inductor",
    "transformer",
    "EDA",
    "design automation",
    "open-source",
    "COBRA",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "David Lurz", email = "david.lurz@fau.de"},
    {name = "Gianluca Simone", email = "gianluca.simone@fau.de"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11"
dependencies = [
    "scikit-rf",
    "scikit-learn",
    "gdsfactory",
    "gds2palace",
    "numpy",
    "tqdm",
    "torch",
    "pandas",
    "PySide6",
    "colorlog",
    "matplotlib",
    "optuna",
    "onnx",
    "onnxruntime",
    "onnxscript>=0.7.1",
]

[project.urls]
Homepage = "https://di-passionate.github.io/ORCA/"
Documentation = "https://di-passionate.github.io/ORCA/"
Repository = "https://github.com/DI-PASSIONATE/ORCA"
Issues = "https://github.com/DI-PASSIONATE/ORCA/issues"
"Related: COBRA" = "https://github.com/DI-PASSIONATE/COBRA"

[project.scripts]
orca = "orca.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
orca = "src/orca"

[tool.setuptools.package-data]
"orca" = ["**/*.simcfg", "**/*.xml"]

[tool.black]
line-length = 79
target-version = ['py311', 'py312', 'py313', 'py314']

[tool.isort]
profile = "black"
line_length = 79
