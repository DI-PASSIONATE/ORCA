[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orca"
version = "1.0.0"
description = "ORCA - Open RF Integrated Circuit Automation: an open-source EDA tool for AI-assisted RFIC design that builds neural network surrogate models of RFIC components (gdsfactory GDS generation, Palace EM simulation, PyTorch training, ONNX export for COBRA)"
readme = "README.md"
keywords = [
    "RFIC",
    "RF integrated circuit",
    "surrogate model",
    "machine learning",
    "neural network",
    "electromagnetic simulation",
    "EM simulation",
    "Palace",
    "gdsfactory",
    "GDS",
    "ONNX",
    "PyTorch",
    "S-parameters",
    "inductor",
    "transformer",
    "EDA",
    "design automation",
    "open-source",
    "COBRA",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "David Lurz", email = "david.lurz@fau.de"},
    {name = "Gianluca Simone", email = "gianluca.simone@fau.de"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "scikit-rf",
    "gdsfactory",
    "gds2palace",
    "klayout",
    "gdspy",
    "numpy",
    "tqdm",
    "pandas",
    "PySide6",
    "qtawesome",
    "colorlog",
    "matplotlib",
    "pebble>=5.2.2",
]

[project.optional-dependencies]
# Model training, ONNX export and model testing (ModelTrainer, OnnxExporter, ModelTester).
# GDS generation, conversion and Palace simulation work without it.
train = [
    "torch",
    "scikit-learn",
    "optuna",
    "onnx",
    "onnxruntime",
    "onnxscript>=0.7.1",
]
# PyTorch build selectors, resolved through the PyTorch indexes below by uv (pip ignores them):
#   uv sync --extra train --extra cpu     # CPU-only wheels, e.g. on an HPC login/compute node
#   uv sync --extra train --extra cu130   # CUDA 13.0 wheels for NVIDIA GPUs (driver >= 580)
#   uv sync --extra train --extra cu126   # CUDA 12.6 wheels for older drivers
# Without a selector, torch comes from PyPI (CUDA-bundled on Linux, CPU on macOS/Windows).
cpu = ["torch"]
cu126 = ["torch"]
cu130 = ["torch"]

[dependency-groups]
# Installed by `uv sync` (not by `pip install`): the linters and test runner CI uses, pinned by uv.lock.
dev = [
    "ruff",
    "ty",
    "pytest",
]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu126" }],
    [{ extra = "cpu" }, { extra = "cu130" }],
    [{ extra = "cu126" }, { extra = "cu130" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.urls]
Homepage = "https://di-passionate.github.io/ORCA/"
Documentation = "https://di-passionate.github.io/ORCA/"
Repository = "https://github.com/DI-PASSIONATE/ORCA"
Issues = "https://github.com/DI-PASSIONATE/ORCA/issues"
"Related: COBRA" = "https://github.com/DI-PASSIONATE/COBRA"

[project.scripts]
orca = "orca.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
orca = "src/orca"

[tool.setuptools.package-data]
"orca" = ["**/*.simcfg", "**/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.coverage.run]
source = ["src/orca"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]


[tool.ruff]
line-length = 100
# Resolve first-party imports out of the src layout.
src = ["src"]
# Scratch/vendored trees that are not part of the package.
extend-exclude = ["Ignore"]

[tool.ruff.lint]
select = [
    "ALL", # include all the rules, including new ones
]
ignore = [
    #### modules
    "ANN", # flake8-annotations: full annotation coverage is not a project goal
    "COM", # flake8-commas: trailing commas are the formatter's job
    "C90", # mccabe complexity: PLR0912/PLR0915 cover this better
    "CPY", # flake8-copyright: no per-file copyright headers in this project
    "DJ",  # django
    "EM",  # exception messages inline, consistent with TRY003 below
    "EXE", # flake8-executable
    "FBT", # boolean traps: unavoidable in Qt slots and config flags
    "PD",  # pandas-vet: false positives on numpy/scikit-rf `.values`
    "T10", # debugger
    "TID", # flake8-tidy-imports

    #### specific rules
    "D100",    # ignore missing docs
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D200",
    "D203",    # incompatible with D211; D211 is the convention here
    "D205",
    "D212",    # summary placement is not enforced; both styles exist in the tree
    "D400",
    "D401",
    "D415",
    "E402",    # false positives for local imports
    "E501",    # line too long
    "N802",    # RF symbols keep their conventional casing (S, Z, Y, N, K, ...)
    "N803",
    "N806",
    "PLC0415", # imports are deliberately local to keep Palace/ORCA/GUI optional
    "PLR0911", # simulation and GUI setup code is legitimately branch-heavy
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004", # magic-value comparison is noise in numeric/engineering code
    "PTH",     # os.path is used throughout; migrating is a separate refactor
    "RUF001",  # ambiguous unicode: units and symbols (µ, Ω, °) are intentional
    "RUF002",
    "RUF003",
    "S603",    # the Xyce subprocess call is the point of the simulator
    "TRY003",  # external messages in exceptions are too verbose
    "TD002",
    "TD003",
    "FIX002",  # too verbose descriptions of todos
]

[tool.ruff.lint.per-file-ignores]
# Examples are standalone scripts, not an importable package. Optional pipeline
# stages are left in as commented-out lines to be enabled by the reader.
"examples/*" = ["INP001", "T201", "ERA001"]
# Tests assert, reach into private helpers deliberately, and use fixtures that
# look like shadowed or unused arguments to the linter.
"tests/*" = [
    "S101",    # assert is how pytest works
    "ARG001",
    "ARG002",
    "PLR6301",
    "SLF001",  # pinning private behaviour (_tell, _parse_target) is the point
    "TC003",
    "T201",    # printing is how a test script reports
]

[tool.ruff.lint.pydocstyle]
convention = "google"
