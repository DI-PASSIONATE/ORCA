[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orca"
version = "1.0.0"
description = "ORCA - Open RF Circuit Automation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "David Lurz", email = "david.lurz@fau.de"},
    {name = "Gianluca Simone", email = "gianluca.simone@fau.de"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
# Capped at 3.12 by ihp-gdsfactory, which declares Requires-Python: >=3.12,<3.13.
# Widen this again once that dependency supports newer interpreters.
requires-python = ">=3.12,<3.13"
dependencies = [
    "scikit-rf",
    "scikit-learn",
    "gdsfactory",
    "ihp-gdsfactory @ git+https://github.com/gdsfactory/IHP.git",
    "gds2palace",
    "numpy",
    "tqdm",
    "torch",
    "pandas",
    "PySide6",
    "colorlog",
    "matplotlib",
    "optuna",
    "onnx",
    "onnxruntime",
    "onnxscript>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
]

[project.scripts]
orca = "orca.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
orca = "src/orca"

[tool.setuptools.package-data]
"orca" = ["**/*.simcfg", "**/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 79
target-version = ['py311', 'py312', 'py313', 'py314']

[tool.isort]
profile = "black"
line_length = 79
